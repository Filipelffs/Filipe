<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fisiomais | Login</title>
    <link rel="stylesheet" href="Css/Login.css">
</head>
<body>

<div class="container">

    <section class="login">
        <h1>Bem-vindo(a) de volta!</h1>
        <img src="Fisiomais.png" alt="Logo_Fisiomais">

        <form action="Dashboard.html">
            <fieldset>
                <legend>Login</legend>

                <label>Email</label>
                <input type="email" required>

                <label>Senha</label>
                <input type="password" required>

                <button id = "e">Entrar</button>
            </fieldset>
        </form>
    </section>

    <section class="cadastro">
        <h1>Ainda não tem cadastro?</h1>

        <form action="Dashboard.html">
            <fieldset>
                <legend>Cadastre-se</legend>

                <label>Nome</label>
                <input type="text" required>

                <label>Email</label>
                <input type="email" required>

                <label>Senha</label>
                <input type="password" required>

                <button id = "i">Cadastrar</button>
            </fieldset>
        </form>
    </section>

</div>

</body>
</html>
