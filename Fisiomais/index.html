<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Divisão.css">
    <title>Fisiomais</title>

</head>

<body>

    <div class="conteiner">

        <section class=Login>

            <h1>Bem-vindo(a) de volta!</h1>

            <img src="Fisiomais.png" atl="Logo" width="90px" height="90px">

            <form action="#" method="get">
                <br>
                <legend>Já tem uma conta? Faça o seu Login</legend>

                <fieldset>

                    <br>
                    <label for="Login">Tela de Login</label><br><br>
                    Email:<input type="email" placeholder="Digite o seu email..." name="Login" id="Login" required><br>
                    Senha:<input type="password" placeholder="Digite sua senha..." name="Login" id="Login"
                        required><br><br>
                    <button type="submit">Enviar</button>
                    <button type="reset">Resetar</button>

                </fieldset>

            </form>

        </section>

        <br>
        <br>

        <section class="Cadastro">
            <div class="Conserto">
                <h1>Ainda não tem cadastro?</h1>

                <form action="#" method="get">

                    <legend>Cadastre-se</legend>
                    <br>
                    <fieldset>

                        <label for="Cadastro">Tela de Cadastro</label><br><br>
                        Nome:<input type="text" name="nome" id="Cadastro" placeholder="Digite seu nome..." required><br>
                        Email:<input type="email" name="email" id="Cadastro" placeholder="Digite seu email..."
                            required><br>
                        Senha:<input type="password" name="senha" id="Cadastro" placeholder="Digite sua senha..."
                            required><br><br>
                        <button type="submit">Enviar</button>
                        <button type="reset">Resetar</button>

                    </fieldset>

                </form>

            </div>

        </section>

    </div>
</body>


</html>
