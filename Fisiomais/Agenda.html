</head>

<body>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <aside class="barra">
        <h2>Fisiomais</h2>
        <nav>

    <main class="main">
        <h1>Agenda</h1>

        <section class="form">
            <label>Paciente</label>
            <input type="text" value="Ana Lima">

            <label>Profissional</label>
            <input type="text" value="Dr. Carlos">

            <label>Data</label>
            <input type="date" value="2026-01-26">

            <label>Horário</label>
            <input type="time" value="10:30">

            <button>Agendar</button>
        </section>

        <section class="tabela">
            <h3>Agendamentos</h3>
            <table>
                <tr>
                    <th>Hora</th>
                    <th>Dia</th>
                    <th>Paciente</th>
                    <th>Profissional</th>
                </tr>
                <tr>
                    <td>09:00</td>
                    <td>26</td>
                    <td>Pedro Alves</td>
                    <td>Dra. Julia</td>
                </tr>
                <tr>
                    <td>10:30</td>
                    <td>26</td>
                    <td>Ana Lima</td>
                    <td>Dr. Carlos</td>
                </tr>
                </tr>
                <tr>
                    <td>14:00</td>
                    <td>28</td>
                    <td>Marcos Silva</td>
                    <td>Dra. Julia</td>
                </tr>
            </table>
        </section>
    </main>
    <script>
        function toggleMenu() {
            document.querySelector('.barra').classList.toggle('ativo');
        }
    </script>
