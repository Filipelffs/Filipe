<main class="main">
<h1>Configurações do Sistema</h1>

<section class="form">
<h3>Dados da Clínica</h3>
<label>Nome da Clínica</label>
<input type="text" value="Clínica Fisiomais LTDA">

<label>CNPJ</label>
<input type="text" value="12.345.678/0001-90">

<label>Telefone</label>
<input type="text" value="(11) 3456-7890">

<label>Email</label>
<input type="email" value="contato@fisiomais.com">
</section>

<br>

<section class="form">
<h3>Usuário Administrador</h3>
<label>Nome</label>
<input type="text" value="Administrador Geral">

<label>Email</label>
<input type="email" value="admin@fisiomais.com">

<label>Nova Senha</label>
<input type="password">
</section>

<br>

<section class="form">
<h3>Preferências do Sistema</h3>
<label>Horário de Funcionamento</label>
<input type="text" value="08:00 às 18:00">

<label>Moeda</label>
<select>
    <option selected>Real (R$)</option>
    <option>Dólar ($)</option>
</select>

<button>Salvar Configurações</button>
</section>

</main>
